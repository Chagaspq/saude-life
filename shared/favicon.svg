<!-- Desenho em SVG (vetor) da logo: quadrado de 64x64 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Área de definições que serão usadas no desenho -->
  <defs>
    <!-- Degradê em diagonal, de baixo à esquerda até em cima à direita -->
    <linearGradient id="g" x1="11" y1="53" x2="53" y2="11" gradientUnits="userSpaceOnUse">
      <!-- Começo do degradê na cor coral -->
      <stop offset="0%" stop-color="#ff7a45"/>
      <!-- Final do degradê na cor esmeralda -->
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Fundo: quadrado verde-carvão com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="#0e1512"/>
  <!-- Anel de progresso quase fechado, pintado com o degradê -->
  <path d="M32 12.2A19.8 19.8 0 1 1 14.85 22.1" stroke="url(#g)" stroke-width="6.6" stroke-linecap="round"/>
  <!-- Linha de batimento cardíaco dentro do anel -->
  <path d="M22.3 32.9H25.4L28.9 25.8L33.3 39.9L36.4 32.9H41.7" stroke="url(#g)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
