<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saúde Life</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
    <!-- O app agora tem uma página por seção, em ../app/. Este arquivo só
         redireciona links antigos (ex.: index.html#treinos → app/treinos.html). -->
    <script>
      (function () {
        var paginas = ["inicio", "descobrir", "treinos", "aulas", "alimentacao", "evolucao",
          "profissionais", "planos", "salvos", "academia", "perfil"];
        var hash = window.location.hash.replace("#", "");
        var pagina = paginas.indexOf(hash) >= 0 ? hash : "inicio";
        window.location.replace("../app/" + pagina + ".html");
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=../app/inicio.html" />
  </head>
  <body>
    <p><a href="../app/inicio.html">Abrir o Saúde Life</a></p>
  </body>
</html>
