# Perfil "postgres": banco da API no ar (Render). O Dockerfile liga este perfil.
# No computador continua o SQL Server (application.properties).

# Endereço do banco (no Render vem das variáveis DB_HOST, DB_PORT e DB_NOME)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NOME:saudelife}
# Usuário do banco
spring.datasource.username=${DB_USUARIO:postgres}
# Senha do banco
spring.datasource.password=${DB_SENHA:postgres}

# As tabelas desta API ficam no schema "api" (separadas das tabelas antigas do banco)
spring.jpa.properties.hibernate.default_schema=api
# Cria o schema "api" se ainda não existe
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# Sem o SQL no log (economiza memória no plano grátis)
spring.jpa.show-sql=false
# No PostgreSQL não usa nvarchar
spring.jpa.properties.hibernate.use_nationalized_character_data=false
