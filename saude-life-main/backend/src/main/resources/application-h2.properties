# Perfil "h2": testa sem SQL Server (banco na memória, os dados somem ao desligar)
# No Spring Tools: Run As > Run Configurations > Arguments > Program arguments: --spring.profiles.active=h2
spring.datasource.url=jdbc:h2:mem:saudelife
# Usuário do H2
spring.datasource.username=sa
# Senha do H2 (vazia)
spring.datasource.password=
# Tela do H2 no navegador: http://localhost:8080/h2-console
spring.h2.console.enabled=true
