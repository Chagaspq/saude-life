<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1512" />
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../shared/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../shared/icon-192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saúde Life" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Saúde Life - Recuperar Senha" />
    <meta property="og:description" content="Recupere o acesso à sua conta no Saúde Life." />
    <meta property="og:image" content="https://chagaspq.github.io/saude-life/shared/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Saúde Life - Recuperar Senha</title>
    <meta
      name="description"
      content="Recupere o acesso à sua conta no Saúde Life."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="senha.css" />
    <link rel="stylesheet" href="../shared/auth.css" />
  </head>
  <body>
    <main class="auth-container">
      <header class="auth-header">
        <div class="logo-compact" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
            <defs>
              <linearGradient
                id="logo-gradient"
                x1="2"
                y1="40"
                x2="46"
                y2="6"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0%" stop-color="#ff7a45" />
                <stop offset="100%" stop-color="#34d399" />
              </linearGradient>
            </defs>
            <path
              d="M4 31 L9 31 L12 19 L15 37 L18 27 C23 13 30 9 35 16 Q40 21 44 8"
              stroke="url(#logo-gradient)"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1>Recuperar senha</h1>
        <p class="auth-subtitle">
          Digite seu e-mail para receber as instruções de redefinição.
        </p>
      </header>

      <form id="recovery-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">E-mail cadastrado</label>
          <div class="input-wrapper">
            <svg
              class="input-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2" y="4" width="20" height="16" rx="3"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              autofocus
              placeholder="seu@email.com"
              aria-describedby="email-error"
            />
          </div>
          <span
            id="email-error"
            class="field-error"
            role="alert"
            aria-live="polite"
          ></span>
        </div>

        <p
          id="form-global-error"
          class="field-error"
          role="alert"
          aria-live="assertive"
          hidden
        ></p>

        <p
          id="form-global-success"
          class="field-success"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <button type="submit" class="btn-submit">
          <span class="btn-text">Enviar instruções</span>
          <span class="spinner" aria-hidden="true" hidden></span>
          <span aria-hidden="true" class="arrow">→</span>
        </button>
      </form>

      <footer class="auth-footer">
        <p>
          Lembrou a senha?
          <a href="../login/login.html">Voltar ao login</a>
        </p>
      </footer>
    </main>

    <!--
      Envio real de e-mail (opcional): configure as chaves no senha.js e
      adicione aqui o SDK do EmailJS. Sem ele, o envio é simulado.
    -->
    <script src="senha.js"></script>
  </body>
</html>
