# Publicação no Render (https://render.com): cria a API e o banco PostgreSQL de uma vez.
# No Render: New > Blueprint > escolha este repositório > Apply.

# Banco de dados
databases:
  # Banco PostgreSQL grátis
  - name: saudelife-banco
    # Plano grátis
    plan: free
    # Nome do banco
    databaseName: saudelife
    # Usuário
    user: saudelife

# Serviços
services:
  # A API (Java + Spring Boot)
  - type: web
    # Nome (vira o endereço: https://saudelife-api.onrender.com)
    name: saudelife-api
    # Roda com Docker
    runtime: docker
    # Pasta da API
    rootDir: backend
    # Receita
    dockerfilePath: ./Dockerfile
    # Plano grátis (dorme depois de 15 min parada; a primeira chamada demora uns 50 s)
    plan: free
    # Rota para o Render saber que ligou
    healthCheckPath: /v1/planos
    # Configurações
    envVars:
      # Endereço do banco (vem do banco acima)
      - key: DB_HOST
        fromDatabase:
          name: saudelife-banco
          property: host
      # Porta do banco
      - key: DB_PORT
        fromDatabase:
          name: saudelife-banco
          property: port
      # Nome do banco
      - key: DB_NOME
        fromDatabase:
          name: saudelife-banco
          property: database
      # Usuário do banco
      - key: DB_USUARIO
        fromDatabase:
          name: saudelife-banco
          property: user
      # Senha do banco
      - key: DB_SENHA
        fromDatabase:
          name: saudelife-banco
          property: password
      # Cria as contas de demonstração (para a apresentação)
      - key: SAUDELIFE_DEMO
        value: "true"
      # Endereço do site
      - key: SAUDELIFE_SITE
        value: https://chagaspq.github.io/saude-life
      # Endereço desta API (para o aviso do Mercado Pago)
      - key: SAUDELIFE_API
        value: https://saudelife-api.onrender.com/v1
      # Sem e-mail configurado, o link de senha também volta na resposta
      - key: SAUDELIFE_MOSTRAR_LINK
        value: "true"
      # E-mail (preencha no painel do Render para mandar e-mails de verdade)
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USUARIO
        sync: false
      - key: MAIL_SENHA
        sync: false
      # Mercado Pago (preencha no painel do Render para cobrar de verdade)
      - key: MERCADOPAGO_TOKEN
        sync: false
