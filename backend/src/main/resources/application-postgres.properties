# Perfil "postgres": usa o banco PostgreSQL de verdade.
# No Spring Tools: Run As > Run Configurations > Profile: postgres
# Antes, crie o banco: CREATE DATABASE saudelife;

# Endereço do banco (no Render vem das variáveis DB_HOST, DB_PORT e DB_NOME)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NOME:saudelife}
# Usuário (pode vir da variável de ambiente DB_USUARIO)
spring.datasource.username=${DB_USUARIO:postgres}
# Senha (pode vir da variável de ambiente DB_SENHA)
spring.datasource.password=${DB_SENHA:postgres}
# Sem a tela do H2
spring.h2.console.enabled=false
# Sem contas de demonstração automáticas
saudelife.demo=${SAUDELIFE_DEMO:false}
# Em produção o link de senha só vai por e-mail
saudelife.mostrar-link-senha=${SAUDELIFE_MOSTRAR_LINK:false}
