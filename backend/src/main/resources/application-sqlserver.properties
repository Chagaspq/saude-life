# Perfil "sqlserver": usa o Microsoft SQL Server (ex.: SQL Server Express no seu computador).
# No Spring Tools: Run As > Run Configurations > Profile: sqlserver
# Antes, no SQL Server Management Studio (SSMS): CREATE DATABASE saudelife;

# Endereço do banco (encrypt=true e trustServerCertificate=true: funciona com o SQL Server instalado no computador)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NOME:saudelife};encrypt=true;trustServerCertificate=true
# Usuário (no SQL Server Express, o "sa" precisa estar habilitado com "SQL Server Authentication")
spring.datasource.username=${DB_USUARIO:sa}
# Senha
spring.datasource.password=${DB_SENHA:SuaSenha#2026}
# Sem a tela do H2
spring.h2.console.enabled=false
# Contas de demonstração (true = cria admin@saudelife.app e demo@saudelife.app, senha demo1234)
saudelife.demo=${SAUDELIFE_DEMO:true}
# Link da senha aparece na resposta (sem servidor de e-mail)
saudelife.mostrar-link-senha=${SAUDELIFE_MOSTRAR_LINK:true}
# Textos em nvarchar (Unicode): acentos e qualquer letra ficam certos
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# As tabelas vêm do script banco/banco-de-dados-sqlserver.sql (rode no SSMS antes); a API só confere se estão certas.
# Se aparecer "Schema-validation: missing table", rode o script primeiro.
spring.jpa.hibernate.ddl-auto=${DDL:validate}
