# Configuração padrão: banco H2 na memória (roda direto no Spring Tools, sem instalar banco)
# Para usar o PostgreSQL, rode com o perfil "postgres" (veja application-postgres.properties)

# Porta do servidor (o Render informa a porta pela variável PORT)
server.port=${PORT:8080}
# Todas as rotas começam com /v1 (ex.: http://localhost:8080/v1/auth/login)
server.servlet.context-path=/v1

# Banco H2 na memória (some ao desligar)
spring.datasource.url=jdbc:h2:mem:saudelife;DB_CLOSE_DELAY=-1
# Usuário do H2
spring.datasource.username=sa
# Senha do H2 (vazia)
spring.datasource.password=
# Tela para ver o banco no navegador: http://localhost:8080/v1/h2-console
spring.h2.console.enabled=true

# Cria e atualiza as tabelas sozinho a partir das classes
spring.jpa.hibernate.ddl-auto=update
# Mantém o banco aberto durante a resposta
spring.jpa.open-in-view=true
# Mostra o SQL no console (troque para true para estudar)
spring.jpa.show-sql=false

# Cria as contas de demonstração ao ligar (admin@saudelife.app e demo@saudelife.app, senha demo1234)
saudelife.demo=${SAUDELIFE_DEMO:true}
# Na demonstração, a rota "esqueci a senha" devolve o link na resposta (não tem servidor de e-mail)
saudelife.mostrar-link-senha=${SAUDELIFE_MOSTRAR_LINK:true}
# Sites que podem chamar a API (o site no GitHub Pages e o Vite no computador)
saudelife.origens=${SAUDELIFE_ORIGENS:https://chagaspq.github.io,http://localhost:5173,http://localhost:5180,http://127.0.0.1:5173}

# Endereço do site (vai no link do e-mail de senha e na volta do pagamento)
saudelife.site=${SAUDELIFE_SITE:https://chagaspq.github.io/saude-life}
# Endereço público desta API (o Mercado Pago avisa os pagamentos aqui)
saudelife.api=${SAUDELIFE_API:http://localhost:8080/v1}

# E-mail (SMTP). Vazio = não envia (só demonstração). Ex.: Gmail com "senha de app", ou Brevo.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Remetente
saudelife.email-de=${MAIL_DE:Saúde Life <nao-responda@saudelife.app>}

# Mercado Pago: token de acesso (Access Token). Vazio = pagamento só de demonstração.
saudelife.mercadopago-token=${MERCADOPAGO_TOKEN:}
