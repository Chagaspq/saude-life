spring.application.name=saudelife

# ---------- Banco de dados: SQL Server ----------
# Antes de rodar, crie o banco no SQL Server Management Studio: CREATE DATABASE saudelife;
# (ou rode o arquivo banco/criar-banco.sql)
# localhost:1433 = SQL Server no seu computador (a porta 1433 precisa estar ligada no SQL Server Configuration Manager)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=saudelife;encrypt=true;trustServerCertificate=true
# Usuário do SQL Server (o "sa" precisa estar habilitado, com "Autenticação do SQL Server")
spring.datasource.username=sa
# Senha do "sa" (troque pela sua)
spring.datasource.password=SuaSenha#2026

# ---------- JPA / Hibernate ----------
# Cria e atualiza as tabelas sozinho a partir das classes (ex.: Usuario -> tabela usuarios)
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o Hibernate roda (bom para estudar)
spring.jpa.show-sql=true
# Textos em nvarchar (acentos certos no SQL Server)
spring.jpa.properties.hibernate.use_nationalized_character_data=true
